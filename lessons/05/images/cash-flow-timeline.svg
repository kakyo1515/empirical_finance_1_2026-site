<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">投資のキャッシュフロー</title>
  <desc id="desc">現在の時点0で100万円を支払い、1年後と2年後にそれぞれ60万円を受け取る。支払いは下向き、受取りは上向きの矢印で示す。</desc>
  <rect width="900" height="360" fill="#ffffff"/>

  <!-- Time axis: equally spaced annual intervals. -->
  <path d="M65 150H820" fill="none" stroke="#61757A" stroke-width="2"/>
  <path d="M830 150L818 144V156Z" fill="#61757A"/>

  <!-- Cash flows: arrow lengths are proportional to their amounts. -->
  <path d="M160 150V270" fill="none" stroke="#B24C3D" stroke-width="5"/>
  <path d="M160 283L149 266H171Z" fill="#B24C3D"/>
  <path d="M420 150V82M680 150V82" fill="none" stroke="#007C73" stroke-width="5"/>
  <path d="M420 70L409 87H431Z M680 70L669 87H691Z" fill="#007C73"/>

  <g fill="#123F45">
    <circle cx="160" cy="150" r="5"/>
    <circle cx="420" cy="150" r="5"/>
    <circle cx="680" cy="150" r="5"/>
  </g>

  <g font-family="Hiragino Sans, Yu Gothic, Meiryo, sans-serif" text-anchor="middle">
    <g fill="#123F45" font-size="23">
      <text x="160" y="103">現在</text>
      <text x="420" y="184">1年後</text>
      <text x="680" y="184">2年後</text>
    </g>
    <g fill="#61757A" font-size="19">
      <text x="160" y="130">t = 0</text>
      <text x="420" y="211">t = 1</text>
      <text x="680" y="211">t = 2</text>
      <text x="815" y="184">時間</text>
    </g>
    <g fill="#007C73">
      <text x="420" y="31" font-size="29" font-weight="600">＋60万円</text>
      <text x="680" y="31" font-size="29" font-weight="600">＋60万円</text>
      <text x="420" y="57" font-size="19">受取り</text>
      <text x="680" y="57" font-size="19">受取り</text>
    </g>
    <g fill="#B24C3D">
      <text x="160" y="317" font-size="29" font-weight="600">−100万円</text>
      <text x="160" y="344" font-size="19">支払い</text>
    </g>
  </g>
</svg>
