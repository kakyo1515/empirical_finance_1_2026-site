<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-label="Macのプロセッサと配布ファイルの対応">
<title>Macのプロセッサと配布ファイルの対応</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#007c73"/></marker></defs>
<style>text{font-family:"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;fill:#20343a} .title{font-size:30px;font-weight:700;fill:#123f45}.label{font-size:24px;font-weight:700}.body{font-size:21px}.small{font-size:18px;fill:#61757a}.code{font-family:monospace;font-size:22px}</style>
<rect width="1000" height="420" rx="18" fill="#f4f8f7"/>
<text x="32" y="50" class="title">Macのプロセッサと配布ファイルの対応</text><rect x="35" y="90" width="930" height="64" rx="12" fill="#e5f2ef" stroke="#cbd8d9" stroke-width="2"/><text x="60" y="131" class="body">Appleメニュー → このMacについて → チップ／プロセッサを確認</text><rect x="35" y="198" width="445" height="150" rx="12" fill="#ffffff" stroke="#cbd8d9" stroke-width="2"/><rect x="520" y="198" width="445" height="150" rx="12" fill="#ffffff" stroke="#cbd8d9" stroke-width="2"/><text x="60" y="239" class="label">Apple M1・M2・M3 …</text><text x="60" y="280" class="body">Apple silicon → arm64</text><text x="60" y="322" class="code">R-x.y.z-arm64.pkg</text><text x="545" y="239" class="label">Intel Core …</text><text x="545" y="280" class="body">Intel → x86_64</text><text x="545" y="322" class="code">R-x.y.z-x86_64.pkg</text><text x="35" y="392" class="small">プロセッサの種類に加え，配布ページに記載されたmacOSの動作条件も確認する．</text></svg>
