<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-label="RStudio Desktopの導入手順">
<title>RStudio Desktopの導入手順</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#007c73"/></marker></defs>
<style>text{font-family:"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;fill:#20343a} .title{font-size:30px;font-weight:700;fill:#123f45}.label{font-size:24px;font-weight:700}.body{font-size:21px}.small{font-size:18px;fill:#61757a}.code{font-family:monospace;font-size:22px}</style>
<rect width="1000" height="600" rx="18" fill="#f4f8f7"/>
<text x="32" y="50" class="title">RStudio Desktopの導入手順</text><rect x="35" y="84" width="930" height="63" rx="12" fill="#fff8e8" stroke="#cbd8d9" stroke-width="2"/><text x="60" y="124" class="label">前提条件：R本体のインストール完了</text><rect x="180" y="180" width="640" height="80" rx="12" fill="#e5f2ef" stroke="#cbd8d9" stroke-width="2"/><text x="205" y="215" class="label">Posit → RStudio Desktop → Open Source</text><text x="205" y="245" class="small">使用するOSに対応した安定版の選択</text><path d="M360 265 L255 303" stroke="#007c73" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M640 265 L745 303" stroke="#007c73" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="35" y="316" width="445" height="182" rx="12" fill="#ffffff" stroke="#cbd8d9" stroke-width="2"/><rect x="520" y="316" width="445" height="182" rx="12" fill="#ffffff" stroke="#cbd8d9" stroke-width="2"/><text x="60" y="357" class="label">Windows：.exe</text><text x="60" y="399" class="body">ファイルを開く</text><text x="60" y="438" class="body">Next → Install → Finish</text><text x="60" y="476" class="small">スタートメニューからRStudioを起動</text><text x="545" y="357" class="label">Mac：.dmg</text><text x="545" y="399" class="body">ファイルを開く</text><text x="545" y="438" class="body">RStudio → Applicationsへドラッグ</text><text x="545" y="476" class="small">アプリケーションからRStudioを起動</text><rect x="35" y="524" width="930" height="50" rx="12" fill="#e5f2ef" stroke="#cbd8d9" stroke-width="2"/><text x="60" y="557" class="body">起動確認：RStudioが開き，R本体が認識されていることを確認する</text></svg>
