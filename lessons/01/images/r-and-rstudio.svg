<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-label="RとRStudioの役割分担">
<title>RとRStudioの役割分担</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#007c73"/></marker></defs>
<style>text{font-family:"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;fill:#20343a} .title{font-size:30px;font-weight:700;fill:#123f45}.label{font-size:24px;font-weight:700}.body{font-size:21px}.small{font-size:18px;fill:#61757a}.code{font-family:monospace;font-size:22px}</style>
<rect width="1000" height="430" rx="18" fill="#f4f8f7"/>
<text x="32" y="50" class="title">RとRStudioの役割分担</text><rect x="40" y="96" width="360" height="188" rx="12" fill="#ffffff" stroke="#cbd8d9" stroke-width="2"/><text x="65" y="140" class="title">RStudio</text><text x="65" y="182" class="body">コードの編集・実行指示</text><text x="65" y="218" class="body">結果の表示・ファイルの管理</text><text x="65" y="256" class="small">分析作業の操作環境</text><rect x="600" y="96" width="360" height="188" rx="12" fill="#e5f2ef" stroke="#cbd8d9" stroke-width="2"/><text x="625" y="140" class="title">R</text><text x="625" y="182" class="body">コードの解釈と計算処理</text><text x="625" y="218" class="code">1 + 2  →  3</text><text x="625" y="256" class="small">RStudioから利用される</text><path d="M413 165 L584 165" stroke="#007c73" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="446" y="146" class="small">コード</text><path d="M587 237 L415 237" stroke="#007c73" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="453" y="266" class="small">結果</text><rect x="40" y="325" width="920" height="72" rx="12" fill="#fff8e8" stroke="#cbd8d9" stroke-width="2"/><text x="65" y="369" class="body">導入順序　① Rの導入　→　② RStudioの導入　→　③ 動作確認</text></svg>
