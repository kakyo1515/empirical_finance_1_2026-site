<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 455" role="img" aria-labelledby="title desc">
  <title id="title">事業利益を債権者と株主に配分する組替P/L</title>
  <desc id="desc">左は事業収益と金融収益に対し、事業費用、金融費用、当期純利益を示した損益計算書。右では事業収益から事業費用を差し引いた事業利益OXを、金融費用から金融収益を差し引いた純金融費用NFEと、株主に帰属する当期純利益Xに対応させる。OXはNFEとXの合計に等しい。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#61757a"/></marker>
  </defs>
  <rect width="1120" height="455" rx="14" fill="white"/>
  <g font-family="Hiragino Sans, Yu Gothic, Noto Sans JP, sans-serif" text-anchor="middle" fill="#20343a">
    <text x="245" y="39" font-size="26" font-weight="700">収益・費用を事業と金融に区分</text>
    <text x="875" y="39" font-size="26" font-weight="700">成果とその配分を見る</text>
    <text x="125" y="99" font-size="21" font-weight="700">費用・株主の利益</text>
    <text x="355" y="99" font-size="21" font-weight="700">収益</text>
    <text x="762" y="99" font-size="21" font-weight="700">成果の配分</text>
    <text x="992" y="99" font-size="21" font-weight="700">事業の箱</text>

    <rect x="25" y="120" width="200" height="90" fill="#e7f4f1" stroke="#007c73" stroke-width="2"/>
    <text x="125" y="157" font-size="23" font-weight="700">事業費用</text>
    <text x="125" y="187" font-size="18">売上原価など</text>
    <rect x="25" y="210" width="200" height="90" fill="#fff3d8" stroke="#ad7811" stroke-width="2"/>
    <text x="125" y="247" font-size="23" font-weight="700">金融費用</text>
    <text x="125" y="277" font-size="18">支払利息など</text>
    <rect x="25" y="300" width="200" height="90" fill="#f1eaf8" stroke="#7c5499" stroke-width="2"/>
    <text x="125" y="337" font-size="23" font-weight="700">当期純利益 X</text>
    <text x="125" y="367" font-size="18">株主の取り分</text>
    <rect x="250" y="120" width="210" height="180" fill="#e7f4f1" stroke="#007c73" stroke-width="2"/>
    <text x="355" y="199" font-size="24" font-weight="700">事業収益</text>
    <text x="355" y="232" font-size="18">売上高など</text>
    <rect x="250" y="300" width="210" height="90" fill="#fff3d8" stroke="#ad7811" stroke-width="2"/>
    <text x="355" y="337" font-size="23" font-weight="700">金融収益</text>
    <text x="355" y="367" font-size="18">受取利息など</text>

    <path d="M493 252 H612" stroke="#61757a" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="553" y="207" font-size="19">同じ活動の</text>
    <text x="553" y="232" font-size="19">項目を差引き</text>

    <rect x="660" y="120" width="205" height="135" fill="#fff3d8" stroke="#ad7811" stroke-width="2"/>
    <text x="762" y="150" font-size="18">債権者の箱</text>
    <text x="762" y="186" font-size="23" font-weight="700">純金融費用 NFE</text>
    <text x="762" y="224" font-size="20">金融費用 − 金融収益</text>
    <rect x="660" y="255" width="205" height="135" fill="#f1eaf8" stroke="#7c5499" stroke-width="2"/>
    <text x="762" y="288" font-size="18">株主の箱</text>
    <text x="762" y="327" font-size="24" font-weight="700">当期純利益 X</text>
    <text x="762" y="363" font-size="23">OX − NFE</text>
    <rect x="890" y="120" width="205" height="270" fill="#e7f4f1" stroke="#007c73" stroke-width="2"/>
    <text x="992" y="220" font-size="24" font-weight="700">事業利益</text>
    <text x="992" y="260" font-size="28" font-weight="700">OX</text>
    <text x="992" y="303" font-size="20">事業収益 − 事業費用</text>
    <text x="992" y="344" font-size="18">事業から得た成果</text>

    <text x="245" y="432" font-size="20">収益 − 費用 = 当期純利益</text>
    <text x="875" y="432" font-size="25" font-weight="700">OX = NFE + X</text>
  </g>
</svg>
