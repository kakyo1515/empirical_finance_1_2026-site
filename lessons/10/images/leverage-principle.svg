<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">てこの原理とROEの関係</title>
  <desc id="desc">財務レバレッジFLEVと事業スプレッドSPREADがともに正の場合の模式図。支点から力点までの距離がFLEV、力点で下向きに加える力がRNOAとNBCの差に対応する。作用点ではROEとRNOAの差に相当する分が上向きに押し上げられる。金融活動の寄与はFLEVとSPREADの積である。</desc>
  <defs>
    <marker id="force-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#ad7811"/></marker>
    <marker id="return-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#007c73"/></marker>
    <marker id="length-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#7c5499" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1120" height="620" rx="14" fill="white"/>
  <g font-family="Hiragino Sans, Yu Gothic, Noto Sans JP, sans-serif" fill="#20343a" text-anchor="middle">
    <text x="560" y="24" font-size="17" fill="#61757a">FLEV &gt; 0・SPREAD &gt; 0 の場合</text>

    <rect x="30" y="44" width="340" height="100" rx="10" fill="#e7f4f1" stroke="#007c73" stroke-width="2"/>
    <text x="200" y="78" font-size="22" font-weight="700" fill="#007c73">押し上げられる分</text>
    <text x="200" y="119" font-size="28">ROE<tspan baseline-shift="sub" font-size="17">t</tspan><tspan baseline-shift="baseline"> − RNOA</tspan><tspan baseline-shift="sub" font-size="17">t</tspan></text>

    <rect x="670" y="44" width="410" height="100" rx="10" fill="#fff3d8" stroke="#ad7811" stroke-width="2"/>
    <text x="875" y="78" font-size="22" font-weight="700" fill="#93650c">加える力：事業スプレッド</text>
    <text x="875" y="119" font-size="28">RNOA<tspan baseline-shift="sub" font-size="17">t</tspan><tspan baseline-shift="baseline"> − NBC</tspan><tspan baseline-shift="sub" font-size="17">t</tspan></text>

    <path d="M200 270 V168" fill="none" stroke="#007c73" stroke-width="8" marker-end="url(#return-arrow)"/>
    <path d="M875 166 V268" fill="none" stroke="#ad7811" stroke-width="8" marker-end="url(#force-arrow)"/>
    <line x1="200" y1="292" x2="875" y2="292" stroke="#61757a" stroke-width="13" stroke-linecap="round"/>
    <path d="M370 301 L318 387 H422 Z" fill="#e0e7e8" stroke="#61757a" stroke-width="2"/>
    <circle cx="200" cy="292" r="11" fill="#007c73"/>
    <circle cx="370" cy="292" r="11" fill="#20343a"/>
    <circle cx="875" cy="292" r="11" fill="#ad7811"/>
    <text x="200" y="334" font-size="22">作用点</text>
    <text x="370" y="269" font-size="22">支点</text>
    <text x="875" y="334" font-size="22">力点</text>
    <text x="370" y="418" font-size="20" fill="#61757a">FLEV = 0</text>

    <line x1="370" y1="431" x2="370" y2="460" stroke="#7c5499" stroke-width="1.5"/>
    <line x1="875" y1="357" x2="875" y2="460" stroke="#7c5499" stroke-width="1.5" stroke-dasharray="5 5"/>
    <line x1="375" y1="449" x2="870" y2="449" stroke="#7c5499" stroke-width="2" marker-start="url(#length-arrow)" marker-end="url(#length-arrow)"/>
    <text x="622" y="483" font-size="23" font-weight="700" fill="#7c5499">てこの長さ：財務レバレッジ</text>
    <text x="622" y="513" font-size="23">FLEV<tspan baseline-shift="sub" font-size="15">t−1</tspan><tspan baseline-shift="baseline"> = NFO</tspan><tspan baseline-shift="sub" font-size="15">t−1</tspan><tspan baseline-shift="baseline"> / BE</tspan><tspan baseline-shift="sub" font-size="15">t−1</tspan></text>

    <rect x="100" y="541" width="920" height="61" rx="10" fill="#f6f8f8"/>
    <text x="560" y="580" font-size="25"><tspan fill="#007c73">ROE<tspan baseline-shift="sub" font-size="16">t</tspan><tspan baseline-shift="baseline"> − RNOA</tspan><tspan baseline-shift="sub" font-size="16">t</tspan></tspan><tspan baseline-shift="baseline"> = </tspan><tspan fill="#7c5499">FLEV<tspan baseline-shift="sub" font-size="16">t−1</tspan></tspan><tspan baseline-shift="baseline"> × </tspan><tspan fill="#93650c">SPREAD<tspan baseline-shift="sub" font-size="16">t</tspan></tspan></text>
  </g>
</svg>
